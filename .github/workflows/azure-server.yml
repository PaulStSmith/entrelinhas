name: Publicar sinalização no Azure

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'scripts/package-server.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/azure-server.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:server
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: editor-crdt-byteforge
          package: .azure-deploy/staging
      - name: Conferir sinalização
        shell: pwsh
        run: ./scripts/check-signaling.ps1
